[workspace]
resolver = "2"
members = [
    "crates/fm-core",
    "crates/fm-detect",
    "crates/fm-format",
    "crates/fm-container",
    "crates/fm-android",
    "crates/fm-apple",
    "crates/fm-cli",
    "crates/fm-wasm",
    "xtask",
]
default-members = [
    "crates/fm-core",
    "crates/fm-detect",
    "crates/fm-format",
    "crates/fm-container",
    "crates/fm-android",
    "crates/fm-apple",
    "crates/fm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ismyphonepwned/fakeMustache"
authors = ["fakeMustache contributors"]

[workspace.dependencies]
fm-core = { path = "crates/fm-core" }
fm-detect = { path = "crates/fm-detect" }
fm-format = { path = "crates/fm-format" }
fm-container = { path = "crates/fm-container" }
fm-android = { path = "crates/fm-android" }
fm-apple = { path = "crates/fm-apple" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1"
thiserror = "2"
tracing = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.2"
base64 = "0.22"
flate2 = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
plist = { version = "1.9", features = ["serde"] }
globset = "0.4"
clap = { version = "4.0", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
