[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "fakemustache"
version = "0.1.0"
description = "Pseudonymize Android bugreports and Apple sysdiagnose archives"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "fakemustache"
