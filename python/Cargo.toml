[package]
name = "fakemustache-py"
version = "0.1.0"
edition = "2021"
publish = false
description = "Python bindings for fakeMustache"

[workspace]

[lib]
name = "fakemustache"
crate-type = ["cdylib"]

[dependencies]
fm-android = { path = "../crates/fm-android" }
fm-apple = { path = "../crates/fm-apple" }
fm-container = { path = "../crates/fm-container" }
fm-core = { path = "../crates/fm-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"

[build-dependencies]
pyo3-build-config = "0.29"
